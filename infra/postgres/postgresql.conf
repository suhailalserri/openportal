# PostgreSQL Performance Tuning for AI Platform
# Adjust values based on your server RAM

# Memory (for 8GB server)
shared_buffers          = 2GB          # 25% of RAM
effective_cache_size    = 6GB          # 75% of RAM
work_mem                = 64MB         # Per query operation
maintenance_work_mem    = 512MB        # For VACUUM, CREATE INDEX

# Connections
max_connections         = 100          # Keep low — use connection pooler
connection_timeout      = 10s

# Write performance
synchronous_commit      = on           # Keep on for billing integrity
checkpoint_completion_target = 0.9
wal_buffers             = 64MB

# Query planner
random_page_cost        = 1.1          # SSD optimized
effective_io_concurrency = 200         # SSD concurrent requests

# Logging (production)
log_min_duration_statement = 1000      # Log queries slower than 1s
log_checkpoints            = on
log_connections            = off
log_disconnections         = off
log_lock_waits             = on
log_autovacuum_min_duration = 250ms

# Autovacuum (important for billing tables with many writes)
autovacuum                     = on
autovacuum_max_workers         = 3
autovacuum_naptime             = 60s
autovacuum_vacuum_cost_delay   = 2ms

# pg_cron extension
shared_preload_libraries = 'pg_cron'
cron.database_name       = 'aiplatform'
