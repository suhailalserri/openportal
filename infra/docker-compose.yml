name: ai-platform

services:

  # ─── REVERSE PROXY ─────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public]
    depends_on: [web, gateway]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ─── AI GATEWAY ────────────────────────────────────────────────────
  gateway:
    image: calciumion/new-api:v0.6.9  # Pin to tested version; check https://github.com/Calcium-Ion/new-api/releases
    restart: unless-stopped
    environment:
      SQL_DSN:            "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_CONN_STRING:  "redis://:${REDIS_PASSWORD}@redis:6379/0"
      SESSION_SECRET:     "${GATEWAY_SESSION_SECRET}"
      INITIAL_ROOT_TOKEN: "${GATEWAY_ROOT_TOKEN}"
      SYNC_FREQUENCY:     "60"
      BATCH_UPDATE_ENABLED: "true"
    networks: [internal, public]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes: [gateway_data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ─── NODE.JS MIDDLEWARE API ─────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV:    production
      PORT:        "4000"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ─── NEXT.JS FRONTEND ──────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV:    production
      PORT:        "3000"
    networks: [internal, public]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ─── POSTGRESQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       "${POSTGRES_DB}"
      POSTGRES_USER:     "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [internal]
    # NEVER expose port 5432 to the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ─── VALKEY (Redis-compatible) ──────────────────────────────────────
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ─── MINIO (Object storage) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes: [minio_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ─── PROMETHEUS ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-admin-api"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    logging: { driver: "json-file", options: { max-size: "5m", max-file: "2" } }

  # ─── GRAFANA ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_SERVER_ROOT_URL:         "https://monitor.${DOMAIN}"
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks: [internal, public]
    depends_on: [prometheus]
    logging: { driver: "json-file", options: { max-size: "5m", max-file: "2" } }

  # ─── LOKI (Log aggregation) ─────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes: [loki_data:/loki]
    networks: [internal]
    logging: { driver: "json-file", options: { max-size: "5m", max-file: "2" } }

  # ─── GATUS (Public status page) ─────────────────────────────────────
  gatus:
    image: twinproduction/gatus:latest
    restart: unless-stopped
    volumes: [./gatus.yml:/config/config.yaml:ro]
    networks: [internal, public]
    logging: { driver: "json-file", options: { max-size: "5m", max-file: "2" } }

  # ─── AUTOMATED DB BACKUPS ───────────────────────────────────────────
  backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    environment:
      POSTGRES_HOST:       postgres
      POSTGRES_DB:         "${POSTGRES_DB}"
      POSTGRES_USER:       "${POSTGRES_USER}"
      POSTGRES_PASSWORD:   "${POSTGRES_PASSWORD}"
      SCHEDULE:            "@daily"
      BACKUP_KEEP_DAYS:    "7"
      BACKUP_KEEP_WEEKS:   "4"
      BACKUP_KEEP_MONTHS:  "6"
      HEALTHCHECK_PORT:    "8080"
    volumes: [./backups:/backups]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true   # No direct internet access from internal services

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  prometheus_data:
  loki_data:
  gateway_data:
