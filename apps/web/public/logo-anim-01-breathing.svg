<svg width="120" height="150" viewBox="-60 -75 120 150" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>OpenPortal — breathing</title>
<desc>Solid amber ellipse gently expanding and contracting. Use for idle state / empty chat.</desc>
<ellipse cx="0" cy="0" rx="30" ry="40" fill="#D9A441">
  <animate attributeName="rx" values="28;33;28" dur="2.8s" repeatCount="indefinite"
           calcMode="spline" keyTimes="0;0.5;1"
           keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  <animate attributeName="ry" values="37;44;37" dur="2.8s" repeatCount="indefinite"
           calcMode="spline" keyTimes="0;0.5;1"
           keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
</ellipse>
</svg>
