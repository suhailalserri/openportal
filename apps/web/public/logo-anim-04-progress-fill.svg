<svg width="120" height="150" viewBox="-60 -75 120 150" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>OpenPortal — progress fill</title>
<desc>Amber stroke fills clockwise from the top around the ring, holds complete, then unwinds. Use for form submit / upload / nav transition.</desc>
<path d="M 0,-40 a 30,40 0 1,1 0,80 a 30,40 0 1,1 0,-80"
      fill="none" stroke="rgba(237,234,226,.18)" stroke-width="4" opacity="0.2"/>
<path d="M 0,-40 a 30,40 0 1,1 0,80 a 30,40 0 1,1 0,-80"
      fill="none" stroke="#D9A441" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="100 100" stroke-dashoffset="100" pathLength="100">
  <animate attributeName="stroke-dashoffset"
           values="100;0;0;100"
           keyTimes="0;0.7;0.9;1"
           dur="4s" repeatCount="indefinite"
           calcMode="spline"
           keySplines="0.4 0 0.6 1;0 0 1 1;0.6 0 0.9 0.4"/>
</path>
</svg>
