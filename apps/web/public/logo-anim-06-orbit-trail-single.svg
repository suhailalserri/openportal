<svg width="120" height="150" viewBox="-60 -75 120 150" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>OpenPortal — orbit and trail (single comet)</title>
<desc>One bright spark head with a fading amber tail behind it, orbiting clockwise. Use for hero moment / premium loader. Superseded by logo-loading.svg, which runs five of these at once with longer tails.</desc>
<defs>
<path id="egg06" d="M 0,-40 a 30,40 0 1,1 0,80 a 30,40 0 1,1 0,-80" pathLength="100"/>
</defs>
<path d="M 0,-40 a 30,40 0 1,1 0,80 a 30,40 0 1,1 0,-80"
      fill="none" stroke="rgba(237,234,226,.18)" stroke-width="1.5" opacity="0.2"/>
<circle r="4" fill="#FFF7DE">
  <animateMotion dur="4s" begin="-1s" repeatCount="indefinite" rotate="0"><mpath href="#egg06"/></animateMotion>
</circle>
<circle r="3.3" fill="#D9A441" opacity="0.72">
  <animateMotion dur="4s" begin="-0.8s" repeatCount="indefinite" rotate="0"><mpath href="#egg06"/></animateMotion>
</circle>
<circle r="2.7" fill="#D9A441" opacity="0.5">
  <animateMotion dur="4s" begin="-0.6s" repeatCount="indefinite" rotate="0"><mpath href="#egg06"/></animateMotion>
</circle>
<circle r="2.1" fill="#D9A441" opacity="0.32">
  <animateMotion dur="4s" begin="-0.4s" repeatCount="indefinite" rotate="0"><mpath href="#egg06"/></animateMotion>
</circle>
<circle r="1.6" fill="#D9A441" opacity="0.16">
  <animateMotion dur="4s" begin="-0.2s" repeatCount="indefinite" rotate="0"><mpath href="#egg06"/></animateMotion>
</circle>
</svg>
