<svg width="120" height="150" viewBox="-60 -75 120 150" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>OpenPortal — ping rings</title>
<desc>Elliptical amber rings ripple outward from the mark and fade. Use for live session / new message indicator.</desc>
<ellipse cx="0" cy="0" rx="30" ry="40" fill="none" stroke="#D9A441" stroke-width="2"/>
<ellipse cx="0" cy="0" rx="30" ry="40" fill="none" stroke="#D9A441" stroke-width="2">
  <animate attributeName="rx" values="30;52;52" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="40;68;68" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.7;0;0" dur="2.4s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="0" cy="0" rx="30" ry="40" fill="none" stroke="#D9A441" stroke-width="2">
  <animate attributeName="rx" values="30;52;52" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="40;68;68" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.7;0;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="0" cy="0" rx="30" ry="40" fill="none" stroke="#D9A441" stroke-width="2">
  <animate attributeName="rx" values="30;52;52" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="40;68;68" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.7;0;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
</ellipse>
</svg>
