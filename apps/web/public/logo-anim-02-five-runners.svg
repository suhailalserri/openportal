<svg width="120" height="150" viewBox="-60 -75 120 150" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>OpenPortal — five runners</title>
<desc>Five identical amber dots evenly phased around the ring, all the same size and opacity. Use for page loader / chat thinking state.</desc>
<defs>
<path id="egg02" d="M 0,-40 a 30,40 0 1,1 0,80 a 30,40 0 1,1 0,-80" pathLength="100"/>
</defs>
<path d="M 0,-40 a 30,40 0 1,1 0,80 a 30,40 0 1,1 0,-80"
      fill="none" stroke="rgba(237,234,226,.18)" stroke-width="1.5" opacity="0.3"/>
<circle r="4" fill="#D9A441">
  <animateMotion dur="4s" begin="-4s" repeatCount="indefinite" rotate="0"><mpath href="#egg02"/></animateMotion>
</circle>
<circle r="4" fill="#D9A441">
  <animateMotion dur="4s" begin="-3.2s" repeatCount="indefinite" rotate="0"><mpath href="#egg02"/></animateMotion>
</circle>
<circle r="4" fill="#D9A441">
  <animateMotion dur="4s" begin="-2.4s" repeatCount="indefinite" rotate="0"><mpath href="#egg02"/></animateMotion>
</circle>
<circle r="4" fill="#D9A441">
  <animateMotion dur="4s" begin="-1.6s" repeatCount="indefinite" rotate="0"><mpath href="#egg02"/></animateMotion>
</circle>
<circle r="4" fill="#D9A441">
  <animateMotion dur="4s" begin="-0.8s" repeatCount="indefinite" rotate="0"><mpath href="#egg02"/></animateMotion>
</circle>
</svg>
