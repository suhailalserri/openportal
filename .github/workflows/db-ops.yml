name: DB Operations

# Manual, one-off database admin tasks (migrate / constraints / seed) that
# would otherwise require pnpm + psql on a local machine. Run from the
# GitHub Actions tab -> "DB Operations" -> "Run workflow".
#
# Setup (one time):
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: DATABASE_URL
#   Value: the Supabase connection string (Project -> Connect). Prefer the session-mode pooler string (port 5432) for DDL; not the 6543 transaction pooler.
#          including ?sslmode=require

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        type: choice
        options:
          - reset-and-migrate-all
          - reset
          - migrate
          - constraints
          - seed
          - seed-models
          - all

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      # No explicit `version:` here — package.json already pins
      # "packageManager": "pnpm@9.0.0", and specifying a version in both
      # places makes pnpm/action-setup fail with "Multiple versions of
      # pnpm specified". Leaving version out makes it read from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # P3.5: `reset` is `DROP SCHEMA public CASCADE` on the production
      # DATABASE_URL, one tap away in the mobile Actions tab. It must never run
      # once real accounts exist. This is a hard stop with no override on purpose:
      # to wipe a populated database, do it by hand and deliberately, after
      # taking a backup (docs/runbooks/SECURITY_SWEEP.md, "Destructive database tasks").
      - name: Guard - refuse to reset a database that has users
        if: ${{ inputs.task == 'reset' || inputs.task == 'reset-and-migrate-all' }}
        run: |
          set -euo pipefail
          n=$(psql "$DATABASE_URL" -tA -c "select case when to_regclass('public.users') is null then 0 else (select count(*) from public.users) end")
          echo "users in target database: $n"
          if [ "$n" -gt 0 ]; then
            echo "::error::Refusing to reset: the database has $n user row(s). Take a backup and reset by hand if you really mean it."
            exit 1
          fi

      - name: Reset — drop and recreate the public schema
        # DESTRUCTIVE: wipes every table. Only use pre-launch / with no
        # real user data — this exists because a stale `users` table
        # (from an older schema, created before drizzle migrations ran)
        # was silently left in place by `CREATE TABLE IF NOT EXISTS`.
        #
        # Also drops the `drizzle` schema, which is where drizzle-kit
        # keeps its own migration-tracking table (__drizzle_migrations) —
        # separate from `public`. Without dropping it too, drizzle-kit
        # sees migration 0000 already marked "applied" from the previous
        # run and skips re-creating all the tables, leaving `public`
        # empty while it reports success.
        if: ${{ inputs.task == 'reset' || inputs.task == 'reset-and-migrate-all' }}
        run: |
          psql "$DATABASE_URL" -c "DROP SCHEMA IF EXISTS drizzle CASCADE; DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Migrate (drizzle-kit) — creates tables
        if: ${{ inputs.task == 'migrate' || inputs.task == 'all' || inputs.task == 'reset-and-migrate-all' }}
        working-directory: packages/db
        run: pnpm db:migrate

      # Every hand-written SQL migration (not tracked by drizzle-kit — see
      # deploy.yml's own copy of this same list and its comment for why
      # each file matters and why this list does not auto-discover new
      # files). This step previously only ran 0001_constraints.sql, so
      # every migration from 0002 onward was never applied to production
      # through this workflow — silently leaving prod behind (badge/
      # category columns, the platform_config table, etc. from 0013/0014
      # included) unless someone applied them by hand separately. Keep
      # this list and deploy.yml's identical.
      - name: Apply constraints & indexes (raw SQL, not tracked by drizzle-kit)
        if: ${{ inputs.task == 'constraints' || inputs.task == 'all' || inputs.task == 'reset-and-migrate-all' }}
        working-directory: packages/db
        run: |
          for f in 0001_constraints 0002_model_sync 0003_payment_methods 0004_two_factor 0005_referrals 0006_model_latency 0009_usage_index 0010_audit_logs_index 0011_passkey 0012_model_provider_icon 0013_model_badge_categories 0014_server_owned_system_prompt 0015_model_category_scores 0016_welcome_bonus 0017_platform_config_rls 0018_revoke_sessions_on_lockout; do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "src/migrations/$f.sql"
          done

      - name: Seed admin + test user + redeem codes
        if: ${{ inputs.task == 'seed' || inputs.task == 'all' || inputs.task == 'reset-and-migrate-all' }}
        working-directory: packages/db
        run: pnpm seed

      - name: Sync MODEL_CATALOG into the models table
        if: ${{ inputs.task == 'seed-models' || inputs.task == 'all' || inputs.task == 'reset-and-migrate-all' }}
        working-directory: packages/db
        run: pnpm seed:models
