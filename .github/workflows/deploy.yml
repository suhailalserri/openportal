name: Test

on:
  push:
    branches: [main, frontend-v2]
  pull_request:
    branches: [main, frontend-v2]

env:
  NODE_VERSION: "20"

# A newer push to the same ref supersedes the older run instead of queueing
# behind it (the Testcontainers job is slow; stale runs just burn minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── CHECK ───────────────────────────────────────────────────────────
  # Type-check + lint across the whole monorepo (was the only job before
  # 0.2; kept as-is, just renamed from "test" to "check" to make room for
  # the new jobs below).
  check:
    name: Type-check & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

  # ─── API TESTS ───────────────────────────────────────────────────────
  # apps/api's vitest suite provisions its own Postgres via Testcontainers
  # (see apps/api/vitest.config.ts + src/test/testDb.ts) — no external
  # Postgres service container or real DATABASE_URL secret needed here.
  # GitHub's ubuntu-latest runners have Docker preinstalled, which is all
  # Testcontainers requires.
  api-tests:
    name: API Tests (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # P1.2: the per-user billing lock uses Lua + SET NX PX + TTLs, which the
    # in-memory fakeRedis.ts cannot model. A real Redis runs alongside the job;
    # billing-lock.service.test.ts fails in CI if TEST_REDIS_URL is missing.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API test suite
        run: pnpm --filter @ai-platform/api test

  # ─── API DOCKER IMAGE ────────────────────────────────────────────────
  # P3.3 (closes G8). Render builds apps/api/Dockerfile on every push to main
  # and does NOT wait for CI, so this job is the only place a broken image is
  # caught before it reaches production. It proves the three things the plan's
  # "done when" asks for: non-root, no tsx/dev deps in the final image, and the
  # app boots (and the image's own HEALTHCHECK turns healthy).
  #
  # Env values are dummies that satisfy apps/api/src/config.ts. DB and Redis are
  # deliberately unreachable: /health has no dependencies and the api listens
  # before touching Redis, so this also guards that property.
  api-docker:
    name: API Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/api/Dockerfile -t ai-platform-api:ci .

      - name: Image is non-root, has a healthcheck, runs the bundle
        run: |
          set -euo pipefail
          user=$(docker inspect --format '{{.Config.User}}' ai-platform-api:ci)
          echo "Config.User = '$user'"
          [ "$user" = "node" ] || { echo "::error::image must run as USER node"; exit 1; }

          uid=$(docker run --rm --entrypoint id ai-platform-api:ci -u)
          echo "effective uid = $uid"
          [ "$uid" != "0" ] || { echo "::error::container runs as root"; exit 1; }

          hc=$(docker inspect --format '{{json .Config.Healthcheck}}' ai-platform-api:ci)
          echo "Healthcheck = $hc"
          [ "$hc" != "null" ] || { echo "::error::no HEALTHCHECK"; exit 1; }

          cmd=$(docker inspect --format '{{json .Config.Cmd}}' ai-platform-api:ci)
          echo "Cmd = $cmd"
          echo "$cmd" | grep -q 'dist/index.js' || { echo "::error::CMD must run dist/index.js"; exit 1; }
          if echo "$cmd" | grep -Eq 'tsx|pnpm'; then echo "::error::CMD must not use tsx/pnpm"; exit 1; fi

      - name: No dev dependencies or source in the final image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh ai-platform-api:ci -c '
            fail=0
            for name in tsx vitest drizzle-kit esbuild pino-pretty; do
              if [ -e "/app/apps/api/node_modules/$name" ]; then echo "LEAK (direct): $name"; fail=1; fi
              if ls /app/node_modules/.pnpm | grep -q "^$name@"; then echo "LEAK (store): $name"; fail=1; fi
            done
            if ls /app/node_modules/.pnpm | grep -q "^@testcontainers"; then echo "LEAK (store): @testcontainers"; fail=1; fi
            [ ! -e /app/apps/api/src ] || { echo "LEAK: apps/api/src is in the image"; fail=1; }
            [ ! -e /app/packages ]     || { echo "LEAK: packages/ is in the image"; fail=1; }
            command -v pnpm >/dev/null 2>&1 && { echo "LEAK: pnpm is in the runtime image"; fail=1; }
            [ -f /app/apps/api/dist/index.js ] || { echo "MISSING: dist/index.js"; fail=1; }
            [ -f /app/apps/api/dist/extract.worker.js ] || { echo "MISSING: dist/extract.worker.js (P5.2 extraction worker)"; fail=1; }
            exit $fail
          '

      - name: Container boots and /health returns 200
        run: |
          set -uo pipefail
          docker run -d --name api-ci -p 4000:4000 \
            --health-interval 5s --health-start-period 5s --health-retries 3 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL="postgres://placeholder:placeholder@127.0.0.1:1/unused" \
            -e REDIS_URL="redis://127.0.0.1:1/0" \
            -e GATEWAY_URL="http://127.0.0.1:1" \
            -e GATEWAY_MASTER_KEY="ci-placeholder" \
            -e GATEWAY_ROOT_TOKEN="ci-placeholder" \
            -e BETTER_AUTH_SECRET="ci-placeholder-32-bytes-minimum-xxxxxxxx" \
            -e INTERNAL_SERVICE_TOKEN="ci-placeholder-internal-service-token-32plus" \
            -e RESEND_API_KEY="ci-placeholder" \
            -e RESEND_FROM_EMAIL="noreply@openportal.site" \
            -e CODE_SALT="ci-placeholder-salt" \
            ai-platform-api:ci

          ok=""
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' api-ci)" != "true" ]; then break; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::/health never returned 200"
            docker logs api-ci || true
            exit 1
          fi
          echo "/health -> 200"

          # The image's own HEALTHCHECK command must also work.
          status=""
          for i in $(seq 1 24); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api-ci)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "HEALTHCHECK status = $status"
          if [ "$status" != "healthy" ]; then
            echo "::error::HEALTHCHECK did not become healthy"
            docker logs api-ci || true
            exit 1
          fi

      - name: Container logs (always)
        if: always()
        run: docker logs api-ci 2>&1 | tail -n 80 || true

  # ─── WEB BUILD ───────────────────────────────────────────────────────
  # `next build` with dummy env vars. This is the job that would have
  # caught the build-breaking-import-reaches-prod-500 failures noted in
  # PAYMENT_METHODS_PLAN.md — type-check alone does not run Next's build
  # pipeline (route generation, RSC boundary checks, etc).
  #
  # Values are deliberately unreachable/fake: nothing in `next build`
  # opens a real network connection or DB connection for these packages,
  # it only needs env validation (packages/db throws at import time if
  # DATABASE_URL is unset at all — see packages/db/src/index.ts) to pass.
  web-build:
    name: Web Build (next build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # NODE_ENV is deliberately NOT set here. pnpm treats NODE_ENV=production
    # as `--prod` and skips devDependencies (typescript, tailwindcss,
    # @tailwindcss/postcss, eslint-config-next…), all of which `next build`
    # needs. `next build` sets NODE_ENV=production for itself.
    env:
      DATABASE_URL: "postgres://placeholder:placeholder@localhost:1/unused"
      REDIS_URL: "redis://localhost:1/0"
      GATEWAY_URL: "http://localhost:1"
      GATEWAY_MASTER_KEY: "ci-placeholder"
      GATEWAY_ROOT_TOKEN: "ci-placeholder"
      BETTER_AUTH_SECRET: "ci-placeholder-32-bytes-minimum-xxxxxxxx"
      BETTER_AUTH_URL: "http://localhost:3000"
      # apps/api/src/config.ts requires INTERNAL_SERVICE_TOKEN.min(32) and
      # throws at import time ("Collecting page data") if it is shorter.
      INTERNAL_SERVICE_TOKEN: "ci-placeholder-internal-service-token-32plus"
      INTERNAL_API_URL: "http://localhost:1"
      RESEND_API_KEY: "ci-placeholder"
      RESEND_FROM_EMAIL: "noreply@openportal.site"
      RESEND_FROM_NAME: "OpenPortal"
      CODE_SALT: "ci-placeholder-salt"
      TURNSTILE_SECRET_KEY: "ci-placeholder"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "ci-placeholder"
      FRONTEND_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # `next build` OOM'd on this runner's default V8 heap after
      # @lobehub/icons (150+ provider icon components) was added —
      # apps/web/next.config.ts's `optimizePackageImports` for that
      # package addresses the root cause (whole-barrel imports bloating
      # the compile graph), but ubuntu-24.04 runners are memory-capped
      # regardless (~7GB shared with the OS and other processes), so this
      # is headroom on top of that fix, not a replacement for it.
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next/font/google downloads the font CSS and files from Google at
      # build time. A transient bad response from fonts.googleapis.com /
      # gstatic makes the loader throw `Cannot read properties of null
      # (reading '1')` from lib/fonts.ts even though the code is fine (seen
      # in the E2E job's build while this job's identical build passed).
      # Retry the build up to 3 times; a real compile error fails all 3
      # attempts the same way and the job is still red.
      - name: Build apps/web
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @ai-platform/web build; then exit 0; fi
            echo "::warning::next build failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          exit 1

  # ─── WEB UNIT TESTS ──────────────────────────────────────────────────
  # No vitest config or test files exist yet in apps/web as of 0.2 — this
  # job is added now (per the plan's own job list) but will only start
  # doing real work once 1.2 adds a vitest config and the formatCredits /
  # lint-rule tests. Until then it's a deliberate no-op pass rather than
  # a failure, so the job SHAPE exists in CI history from before there's
  # anything to break.
  web-unit:
    name: Web Unit Tests (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests (no-op until 1.2 adds vitest config)
        working-directory: apps/web
        run: |
          if [ -f vitest.config.ts ] || [ -f vitest.config.mts ]; then
            pnpm exec vitest run
          else
            echo "No vitest config in apps/web yet (expected until session 1.2) — skipping."
          fi

  # ─── I18N PARITY ─────────────────────────────────────────────────────
  # scripts/check-i18n.ts doesn't exist yet either (also lands in 1.2).
  # Same no-op-until-it-exists pattern as web-unit above.
  i18n-parity:
    name: i18n Key Parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check ar/en key parity (no-op until 1.2 adds the script)
        working-directory: apps/web
        run: |
          if [ -f scripts/check-i18n.ts ]; then
            pnpm exec tsx scripts/check-i18n.ts
          else
            echo "scripts/check-i18n.ts doesn't exist yet (expected until session 1.2) — skipping."
          fi

  # ─── SYNC LEGAL DOCS ─────────────────────────────────────────────────
  # Phase 3.2. Fails loud if apps/web/content/legal/*.md ever drifts from
  # docs/legal/*.md — see apps/web/scripts/sync-legal.ts's own header for
  # the full rationale (a stale copy of the ToS/Privacy Policy shipping
  # to production is a legal-accuracy problem, not just a build nit).
  legal-docs-sync:
    name: Legal Docs In Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify content/legal matches docs/legal
        working-directory: apps/web
        run: pnpm run sync-legal:check

  # ─── E2E (Playwright) ────────────────────────────────────────────────
  # Phase 3.2, first e2e job in this repo. Only boots apps/web — NOT
  # apps/api's standalone Fastify server. Confirmed by reading the actual
  # code (see apps/web/playwright.config.ts's own comment for the full
  # trace): apps/web/app/api/trpc/[trpc]/route.ts calls the shared
  # appRouter in-process, and apps/web/lib/auth.ts's betterAuth() talks to
  # Postgres directly — neither one makes an HTTP call to apps/api on
  # :4000. Login and the landing page (this phase's two new e2e specs)
  # only exercise apps/web, so a real apps/api process would add CI time
  # and failure surface for zero coverage gained.
  #
  # ENV VARS: this job needs the SAME full set web-build already declares
  # (see that job's own comment for INTERNAL_SERVICE_TOKEN etc.) — NOT
  # because apps/web's OWN code needs them, but because
  # apps/web/server/router.ts (frozen, pre-existing — unrelated to this
  # phase) already re-exports @ai-platform/api/routers's appRouter, whose
  # import graph eagerly loads apps/api/src/config.ts (models.router.ts →
  # model-sync.service.ts → "../config"; admin.router.ts →
  # gateway-channels.service.ts → "../config" — both confirmed by direct
  # source read, both imported at module scope, not lazily). That
  # module throws on missing/invalid env vars at *import* time. This was
  # already true in production before Phase 3.2 touched anything — any
  # request to /api/trpc/* already required this full env surface. What
  # Phase 3.2 changes is the BLAST RADIUS: apps/web/lib/trpc-server.ts
  # (new) is imported by the landing page's Server Components
  # (ModelGrid/PackageGrid), so now a misconfigured env var breaks the
  # public landing page too, not just authenticated tRPC calls. This is
  # flagged prominently in docs/frontend/BRANCH_AND_CI_NOTES.md as a
  # known trade-off worth a future phase's attention (splitting the
  # public-only procedures out of the router that needs
  # apps/api/src/config.ts at all) — not silently worked around here.
  #
  # DATABASE_URL/DATABASE_SSL: unlike web-build (compile-only, placeholder
  # DB), this job actually boots the app and hits a real Postgres, so it
  # needs a real, reachable connection — the `postgres:16-alpine` service
  # container below, on the default port GitHub exposes it on.
  # DATABASE_SSL=disable follows the exact precedent already established
  # in apps/api/src/test/testDb.ts ("packages/db forces TLS unless
  # DATABASE_SSL=disable; the container has [no TLS]").
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Phase 9.2a: apps/api (booted by playwright.config.ts) needs a real
      # Redis — rate limits and chat idempotency (F4) use it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgres://e2e:e2e@localhost:5432/e2e"
      DATABASE_SSL: "disable"
      # Same placeholder values as web-build for everything apps/web's own
      # runtime code doesn't actually call (Redis, the gateway, Resend,
      # Telegram) — this job's specs (login, landing) never exercise
      # those paths, so these only need to be VALID per apps/api/src/
      # config.ts's schema (min length / url format), not real/reachable.
      REDIS_URL: "redis://localhost:6379/0"
      GATEWAY_URL: "http://localhost:4010"   # e2e/mock-gateway/server.mjs
      GATEWAY_MASTER_KEY: "ci-placeholder"
      GATEWAY_ROOT_TOKEN: "ci-placeholder"
      BETTER_AUTH_SECRET: "ci-placeholder-32-bytes-minimum-xxxxxxxx"
      BETTER_AUTH_URL: "http://localhost:3100"
      INTERNAL_SERVICE_TOKEN: "ci-placeholder-internal-service-token-32plus"
      INTERNAL_API_URL: "http://localhost:4000"   # apps/api, started by Playwright
      RESEND_API_KEY: "ci-placeholder"
      RESEND_FROM_EMAIL: "noreply@openportal.site"
      RESEND_FROM_NAME: "OpenPortal"
      CODE_SALT: "ci-placeholder-salt"
      TURNSTILE_SECRET_KEY: ""   # empty → server-side check no-ops (lib/turnstile-server.ts)
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""   # empty → widget reports a placeholder token (register/redeem specs)
      FRONTEND_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      # Same headroom as web-build's identical NODE_OPTIONS, for the same
      # reason — this job's "Build apps/web" step below runs the same
      # `next build` that OOM'd after @lobehub/icons was added. See
      # web-build's env block comment for the full explanation and the
      # optimizePackageImports fix in apps/web/next.config.ts.
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run DB migrations
        run: pnpm --filter @ai-platform/db db:migrate

      # drizzle-kit only applies what is in meta/_journal.json (0000).
      # 0001-0006 are hand-written idempotent SQL, applied by hand in
      # production (see db-ops.yml), so a fresh CI database is missing
      # e.g. users.referral_bonus_awarded_at (0005) and the payment /
      # model-sync tables and columns. Apply them in order. 0007/0008 are
      # Supabase hardening (RLS, function search_path) and irrelevant on
      # this throwaway database. 0001's pg_cron block is wrapped in an
      # exception handler and is skipped on plain Postgres. 0009/0010 are
      # index-only migrations (safe to have skipped historically — they
      # don't gate any query correctness, only performance — but included
      # now for the same reason 0012 is: keep this list in sync with
      # every file the seed step's schema actually depends on, not just
      # the ones that happened to cause a visible failure). 0012 adds
      # models.provider_icon_key, which seed:models writes to via the
      # Drizzle schema — omitting it here is exactly what caused
      # "column \"provider_icon_key\" of relation \"models\" does not
      # exist" in CI. 0013 adds models.badge/categories, 0014 adds
      # models.system_prompt + conversations.summary/
      # summarized_message_count + the platform_config table — omitting
      # either is exactly what caused "column \"categories\" of relation
      # \"models\" does not exist" (0013) immediately followed by the same
      # failure again for "system_prompt" (0014) once 0013 alone was
      # added and this comment wasn't updated to match. 0015 adds
      # models.category_scores (the per-category leaderboard/ranking
      # scores the chat model picker sorts by) — omitting it is exactly
      # what caused "column \"category_scores\" of relation \"models\"
      # does not exist" the same way, a third time. When adding a new
      # 00NN migration file, add its name to this list in the SAME PR —
      # this loop does not discover files on its own the way
      # db:migrate:manual does (see that script's own comment); nothing
      # enforces the two staying in sync automatically, which is exactly
      # how 0013/0014/0015 were missed here in a row. 0016 adds
      # users.welcome_bonus_claimed_at + the platform_config welcome-bonus
      # columns + the welcome_bonus tx_type value — omitting it is exactly
      # what caused "column \"welcome_bonus_claimed_at\" of relation
      # \"users\" does not exist" in the seed step.
      - name: Apply raw SQL migrations (0001-0019)
        run: |
          for f in 0001_constraints 0002_model_sync 0003_payment_methods 0004_two_factor 0005_referrals 0006_model_latency 0009_usage_index 0010_audit_logs_index 0011_passkey 0012_model_provider_icon 0013_model_badge_categories 0014_server_owned_system_prompt 0015_model_category_scores 0016_welcome_bonus 0017_platform_config_rls 0018_revoke_sessions_on_lockout 0019_auth_rate_limit 0020_provider_prices_backfill 0024_message_content_blocks; do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "packages/db/src/migrations/$f.sql"
          done

      - name: Seed test users (admin@localhost.dev / user@localhost.dev)
        run: pnpm --filter @ai-platform/db seed

      - name: Seed models (MODEL_CATALOG → models table)
        run: pnpm --filter @ai-platform/db seed:models

      # NOTE: no `packages` (credit packages) seed step exists — there is
      # no seed script for that table anywhere in this repo today (see
      # e2e/landing.spec.ts's own comment). The landing page's package
      # section is therefore expected to render its empty state in this
      # job, and the spec asserts exactly that rather than assuming data
      # that was never seeded.

      # Retried for the same transient Google Fonts failure described in
      # the web-build job's "Build apps/web" step.
      - name: Build apps/web
        working-directory: apps/web
        run: |
          for attempt in 1 2 3; do
            if pnpm run build; then exit 0; fi
            echo "::warning::next build failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          exit 1

      - name: Run Playwright tests
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

# ─── NOTE ON DEPLOYMENT ────────────────────────────────────────────────
# This workflow is CI (checks) only. Actual deploys are handled outside
# GitHub Actions:
#   - apps/web  -> Vercel, auto-deploys on push (production: main branch,
#                  preview: every other branch/PR, including frontend-v2)
#   - apps/api  -> Render, auto-deploys on push to main via Render's own
#                  GitHub integration (see the note this file already had)
# Do not add SSH/docker-compose deploy steps back here — that infra was
# removed when the project moved off the single-VPS setup described in
# AI_Aggregator_Master_Plan_v2.md.
