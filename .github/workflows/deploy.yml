name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ─── TEST ────────────────────────────────────────────────────────────
  test:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

  # ─── DEPLOY ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: deploy
          key:      ${{ secrets.VPS_SSH_KEY }}
          timeout:  300s
          script: |
            set -euo pipefail
            cd /opt/ai-platform

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Building Docker images in parallel..."
            cd infra && docker compose build --parallel

            echo "→ Running database migrations..."
            docker compose run --rm api pnpm --filter @ai-platform/db db:migrate

            echo "→ Rolling update..."
            docker compose up -d --remove-orphans --no-deps web api

            echo "→ Waiting for health checks..."
            sleep 15

            echo "→ Verifying health..."
            curl -f "https://chat.${{ secrets.DOMAIN }}/api/health" || exit 1
            curl -f "https://api.${{ secrets.DOMAIN }}/api/status"  || exit 1

            echo "✅ Deployed: $(git rev-parse --short HEAD)"

      - name: Notify Telegram — Success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ *Deploy successful*%0A%0ABranch: \`main\`%0ACommit: \`$(echo ${{ github.sha }} | cut -c1-7)\`%0AAuthor: ${{ github.actor }}" \
            -d "parse_mode=Markdown"

      - name: Notify Telegram — Failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ *Deploy FAILED*%0A%0ACommit: \`$(echo ${{ github.sha }} | cut -c1-7)\`%0AAuthor: ${{ github.actor }}%0A%0ACheck Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "parse_mode=Markdown"
