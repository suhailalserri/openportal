name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ─── TEST ────────────────────────────────────────────────────────────
  # NOTE: deployment is handled by Render's own GitHub integration
  # (auto-deploys on push to main), not by this workflow. The previous
  # version of this file also SSH'd into a VPS via docker-compose — that
  # infra no longer exists, so it's removed. If Render's webhook isn't
  # active for some reason, check the service settings in the Render
  # dashboard rather than re-adding a deploy step here.
  test:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint
