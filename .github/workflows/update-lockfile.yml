name: Update Lockfile

# Manual only. Run this whenever a package.json dependency changes and CI
# starts failing with ERR_PNPM_OUTDATED_LOCKFILE.
on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Delete pnpm-lock.yaml first and resolve everything from scratch"
        type: boolean
        default: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # NOTE: deliberately NOT using setup-node's built-in pnpm cache here.
      # ORIGINAL cause suspected here was a stale cached binary; that theory
      # was disproven by a repeat failure with caching already off. Actual
      # root cause: drizzle-kit, tsx, and vite each depend on a DIFFERENT
      # esbuild version (0.18/0.19, 0.28, 0.21 respectively), so pnpm
      # installs multiple esbuild copies side by side — and esbuild's own
      # postinstall version-check script has a known race under that
      # multi-version layout, where one version's install.js validates
      # against a sibling version's package.json/binary mid-install.
      # Fixed via `pnpm.overrides.esbuild` in the root package.json, which
      # forces a single esbuild version workspace-wide and removes the
      # multi-version tree the race depends on. Leaving cache disabled
      # here anyway since a clean install is still the right call for a
      # one-off lockfile-regeneration job.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Delete old lockfile (only when "fresh" is ticked)
        if: ${{ inputs.fresh }}
        run: rm -f pnpm-lock.yaml

      - name: Install without cache (regenerates lockfile)
        run: pnpm install --no-frozen-lockfile

      # Collapses any package that ended up resolved twice.
      - name: Dedupe
        run: pnpm dedupe

      # Fails the job (before anything is committed) if drizzle-orm is still
      # split across peer-dependency variants, which is what breaks type-check.
      - name: Verify a single drizzle-orm copy
        run: |
          echo "drizzle-orm variants in lockfile:"
          grep -E "^  drizzle-orm@0\.31\.4\(" pnpm-lock.yaml || true
          count=$(grep -cE "^  drizzle-orm@0\.31\.4\(" pnpm-lock.yaml || true)
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly 1 drizzle-orm variant, found $count. Re-run with 'fresh' ticked."
            exit 1
          fi

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --staged --quiet || git commit -m "chore: update pnpm-lock.yaml [skip ci]"
          git push
