name: DB Migrate

# Manual only — triggered from GitHub's Actions tab (works fine from the
# mobile browser/app: repo → Actions → "DB Migrate" → Run workflow).
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Which drizzle-kit command to run"
        required: true
        default: "migrate"
        type: choice
        options:
          - generate
          - migrate
          - reset-and-migrate
          - seed

jobs:
  db-migrate:
    name: Run drizzle-kit
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Wipes everything in the public schema — including drizzle's own
      # migration-tracking table — so the next `migrate` starts from zero
      # instead of colliding with tables created by an earlier, different
      # version of the schema (e.g. an old `db:push` with a bigint id where
      # the current schema expects uuid).
      - name: Drop and recreate public schema
        if: inputs.command == 'reset-and-migrate'
        run: |
          psql "${{ secrets.DATABASE_URL }}" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Run drizzle-kit
        if: inputs.command != 'seed'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.command }}" = "reset-and-migrate" ]; then
            pnpm exec drizzle-kit migrate
          else
            pnpm exec drizzle-kit ${{ inputs.command }}
          fi

      - name: Seed database
        if: inputs.command == 'seed'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run seed

      # `generate` writes new migration SQL files to the repo — this commits
      # them back so `migrate` (run next, or on your next deploy) has them.
      - name: Commit generated migration files
        if: inputs.command == 'generate'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/migrations
          git diff --staged --quiet || git commit -m "chore: generate db migration [skip ci]"
          git push
